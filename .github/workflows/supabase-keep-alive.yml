name: Keep Supabase Alive

on:
  schedule:
    # Runs every Monday and Thursday at midnight UTC.
    # Feel free to change to '0 0 */3 * *' if you prefer every 3 days.
    - cron: '0 0 * * 1,4' 
  workflow_dispatch: # Allows you to manually trigger it anytime from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/BlogArticle?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"